openapi: 3.1.0
info:
  title: TransFlow MVP API
  version: 0.2.0
  description: 本地 PDF 元数据、PDFMathTranslate 逐页重建、预热与整本译文下载接口。
servers:
  - url: http://127.0.0.1:8787
paths:
  /api/v1/health:
    get:
      summary: 查询服务、模型与 PDF 重建引擎状态
      responses:
        "200":
          description: 服务可用
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /api/v1/documents:
    post:
      summary: 上传 PDF 并优先翻译前 5 页
      parameters:
        - in: header
          name: X-Filename
          required: true
          schema: { type: string }
        - in: header
          name: X-Target-Language
          required: false
          schema: { type: string, default: zh-CN }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: 文档创建成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "413": { description: 文件超过 50 MB }
        "422": { description: PDF 无效、加密或没有页面 }
  /api/v1/documents/{document_id}:
    get:
      summary: 获取文档和每页状态
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: 文档状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
  /api/v1/documents/{document_id}/source.pdf:
    get:
      summary: 获取任务原始 PDF，用于刷新后恢复预览
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: 原始 PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /api/v1/documents/{document_id}/timings:
    get:
      summary: 获取逐页性能汇总
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200": { description: 页面阶段、LLM 与排队耗时汇总 }
  /api/v1/documents/{document_id}/pages/{page_number}:
    get:
      summary: 获取页面状态及译文 PDF 地址
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/PageNumber"
      responses:
        "200":
          description: 页面结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageResult" }
  /api/v1/documents/{document_id}/pages/{page_number}/translated.pdf:
    get:
      summary: 获取 PDFMathTranslate 生成的单页译文 PDF
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/PageNumber"
      responses:
        "200":
          description: 单页译文 PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "409": { description: 页面尚未翻译完成 }
  /api/v1/documents/{document_id}/pages/{page_number}/timing:
    get:
      summary: 获取单页阶段耗时和 LLM 指标
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/PageNumber"
      responses:
        "200": { description: 单页性能报告 }
  /api/v1/documents/{document_id}/pages/{page_number}/translate:
    post:
      summary: 强制重新翻译一页
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/PageNumber"
      responses:
        "202": { description: 已加入队列 }
  /api/v1/documents/{document_id}/prefetch:
    post:
      summary: 从指定页起预热连续页面
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                start_page: { type: integer, minimum: 1 }
                count: { type: integer, minimum: 1, maximum: 10, default: 5 }
              required: [start_page]
      responses:
        "202": { description: 已加入队列 }
  /api/v1/documents/{document_id}/translated.pdf:
    get:
      summary: 下载合并后的整本译文 PDF
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: 整本译文 PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "409": { description: 尚有页面未完成 }
components:
  parameters:
    DocumentId:
      in: path
      name: document_id
      required: true
      schema: { type: string }
    PageNumber:
      in: path
      name: page_number
      required: true
      schema: { type: integer, minimum: 1 }
  schemas:
    Health:
      type: object
      properties:
        status: { const: ok }
        llm_mode: { enum: [openai, mock] }
        llm_configured: { type: boolean }
        model: { type: string }
        engine: { type: string }
        base_url_configured: { type: boolean }
        prefetch_pages: { type: integer }
        scheduler:
          type: object
          properties:
            workers: { type: integer, minimum: 1 }
            queue_depth: { type: integer, minimum: 0 }
          required: [workers, queue_depth]
        llm_runtime:
          type: object
          properties:
            qps: { type: integer, minimum: 1 }
            workers_per_page: { type: integer, minimum: 1 }
            max_in_flight: { type: integer, minimum: 1 }
            max_attempts: { type: integer, minimum: 1 }
            timeout_seconds: { type: integer, minimum: 1 }
            translate_table_text: { type: boolean }
          required: [qps, workers_per_page, max_in_flight, max_attempts, timeout_seconds, translate_table_text]
        engine_runtime:
          type: object
          properties:
            layout_model_ready: { type: boolean }
            layout_model_load_ms: { type: integer, minimum: 0 }
            table_model_ready: { type: boolean }
            table_model_load_ms: { type: integer, minimum: 0 }
            translator_count: { type: integer, minimum: 0 }
          required: [layout_model_ready, layout_model_load_ms, table_model_ready, table_model_load_ms, translator_count]
      required: [status, llm_mode, llm_configured, model, engine, base_url_configured, prefetch_pages, scheduler, llm_runtime, engine_runtime]
    PageMetrics:
      type: object
      properties:
        queue_wait_ms: { type: integer, minimum: 0 }
        total_ms: { type: integer, minimum: 0 }
        stage_durations_ms:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        llm_logical_requests: { type: integer, minimum: 0 }
        llm_cache_hits: { type: integer, minimum: 0 }
        llm_request_attempts: { type: integer, minimum: 0 }
        llm_rate_limit_errors: { type: integer, minimum: 0 }
        llm_error_count: { type: integer, minimum: 0 }
        llm_latency_ms_total: { type: integer, minimum: 0 }
        llm_latency_ms_max: { type: integer, minimum: 0 }
        llm_in_flight_wait_ms_total: { type: integer, minimum: 0 }
        prompt_tokens: { type: integer, minimum: 0 }
        completion_tokens: { type: integer, minimum: 0 }
        source_page_reused: { type: boolean }
        source_page_create_ms: { type: integer, minimum: 0 }
        layout_model_reused: { type: boolean }
        layout_model_load_ms: { type: integer, minimum: 0 }
        translator_reused: { type: boolean }
        translator_create_ms: { type: integer, minimum: 0 }
        table_ocr_used: { type: boolean }
        table_model_reused: { type: boolean }
        table_model_load_ms: { type: integer, minimum: 0 }
        job_cleanup_ms: { type: integer, minimum: 0 }
      required: [queue_wait_ms, total_ms, stage_durations_ms, llm_logical_requests, llm_cache_hits, llm_request_attempts, llm_rate_limit_errors, llm_error_count, llm_latency_ms_total, llm_latency_ms_max, llm_in_flight_wait_ms_total, prompt_tokens, completion_tokens, source_page_reused, source_page_create_ms, layout_model_reused, layout_model_load_ms, translator_reused, translator_create_ms, table_ocr_used, table_model_reused, table_model_load_ms, job_cleanup_ms]
    PagePreflight:
      type: object
      properties:
        native_text: { type: boolean }
        text_character_count: { type: integer, minimum: 0 }
      required: [native_text, text_character_count]
    PageSummary:
      type: object
      properties:
        page_number: { type: integer }
        attempt: { type: integer, minimum: 0 }
        status: { enum: [pending, queued, preparing, analyzing, translating, typesetting, generating, validating, ready, error] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        stage: { enum: [pending, queued, preparing, analyzing, translating, typesetting, generating, validating, ready, error] }
        stage_label: { type: string }
        stage_current: { type: integer, minimum: 0 }
        stage_total: { type: integer, minimum: 0 }
        queue_position: { type: [integer, "null"], minimum: 1 }
        queue_total: { type: integer, minimum: 0 }
        queued_at: { type: [string, "null"] }
        started_at: { type: [string, "null"] }
        finished_at: { type: [string, "null"] }
        metrics: { $ref: "#/components/schemas/PageMetrics" }
        preflight: { $ref: "#/components/schemas/PagePreflight" }
        error: { type: [string, "null"] }
        updated_at: { type: [string, "null"] }
      required: [page_number, attempt, status, progress, stage, stage_label, stage_current, stage_total, queue_position, queue_total, queued_at, started_at, finished_at, metrics, preflight, error, updated_at]
    Document:
      type: object
      properties:
        id: { type: string }
        filename: { type: string }
        size_bytes: { type: integer }
        page_count: { type: integer }
        target_language: { type: string }
        status: { enum: [active, error] }
        created_at: { type: string }
        prefetch_pages: { type: integer }
        translated_pdf_ready: { type: boolean }
        pages:
          type: array
          items: { $ref: "#/components/schemas/PageSummary" }
      required: [id, filename, size_bytes, page_count, target_language, status, created_at, prefetch_pages, translated_pdf_ready, pages]
    PageResult:
      allOf:
        - $ref: "#/components/schemas/PageSummary"
        - type: object
          properties:
            source_text: { type: string }
            translated_pdf_url: { type: [string, "null"] }
          required: [source_text, translated_pdf_url]
